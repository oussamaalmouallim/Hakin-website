# H MODE — intégration continue : chaque push et chaque pull request.
# Types, tests unitaires et d'intégration, build, tests navigateur (Playwright), synchro des routes avec l'hébergement.
# Sans aucun secret : le build de contrôle se fait sans Supabase (le site retombe sur le parcours WhatsApp seul).
name: CI

# Flux : on travaille sur dev ; une demande de fusion dev → main n'est fusionnée que si ce contrôle est vert.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  qualite:
    name: Types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: https://exemple.invalid # vérifie la génération de sitemap.xml
      - name: Fichiers du build (sitemap, routes, version, aperçus de partage)
        run: |
          test -f dist/sitemap.xml && test -f dist/_redirects && test -f dist/version.json
          fiche=$(ls dist/produit | head -1)
          grep -q 'property="og:image" content="https://exemple.invalid/partage/' "dist/produit/$fiche/index.html"
          test "$(find dist/partage -name '*.jpg' -size +300k | wc -l)" -eq 0 # WhatsApp : image de moins de 300 Ko

  navigateur:
    name: Playwright (site)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-site
          path: |
            web/rapports/playwright
            web/rapports/playwright-resultats
          retention-days: 7

  image:
    name: Image Docker (build de contrôle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          load: true
          tags: hmode-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Santé du conteneur et statuts HTTP
        run: |
          docker run -d --name web -p 8080:8080 hmode-web:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/sante && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/boutique)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/adresse-inconnue)" = 404
          curl -sI http://localhost:8080/ | grep -qi '^content-security-policy:'
          docker rm -f web
