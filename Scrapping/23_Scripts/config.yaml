# H Mode — collecte d'images mode homme automne-hiver
# Toutes les limites sont modifiables ici. Les compteurs sont calculés depuis la base
# (20_Metadata/state.sqlite) : une relance reprend là où la collecte s'est arrêtée.

user_agent: "HModeImageResearchBot/0.1 (bot; internal visual research; respects robots.txt)"
request_timeout: 25
min_delay_per_host: 1.5      # secondes entre deux requêtes vers le même hôte
max_retries: 3
max_429_per_host: 4         # au-delà : hôte ignoré pour le reste de l'exécution (pas d'insistance)

quality:
  reject_min_side: 400        # en dessous : miniature inutilisable -> rejet
  small_min_side: 800         # en dessous : signalé "petite"
  blur_threshold: 60.0        # variance du laplacien ; en dessous : signalé "flou_possible"
  near_dup_hamming: 3         # distance pHash <= seuil : signalé quasi-doublon (non supprimé)

# Quotas par défaut (lot "full"). Un lot peut les surcharger.
quotas:
  max_per_source: 400
  max_per_category: 400
  max_per_subcategory: 120
  max_images_per_product: 4
  max_products_per_listing: 60

batches:
  pilot:
    quotas:
      max_per_source: 40
      max_per_category: 40
      max_per_subcategory: 12
      max_images_per_product: 3
      max_products_per_listing: 8
    max_pages_per_listing: 1

  full:
    max_pages_per_listing: 4

# Sources. "enabled: false" + "reason" = source identifiée mais non collectée (documentée dans les rapports).
# license_class : commercial_ok | autorisation_necessaire | reference_interne | inconnue
sources:
  kiabi_ma:
    enabled: true
    type: shopify
    name: "Kiabi Maroc"
    base: "https://www.kiabi.ma"
    min_delay: 65              # products.json : 1 requête / ~60 s tolérée (429 + Retry-After: 60 observés)
    source_type: "site_enseigne"
    market: "maroc"
    license_class: autorisation_necessaire
    license_note: "Photos produit Kiabi, droits réservés. Usage interne de référence uniquement sans accord."
    listings:
      - {collection: k-seat-homme}
      - {collection: k-jean-homme}
      - {collection: k-pull-homme}
      - {collection: k-manteau-homme}
      - {collection: k-veste-homme}
      - {collection: k-chemise-homme}
      - {collection: k-sport-homme}
      - {collection: k-accessoires-homme}
      - {collection: k-chaussures-homme}
      - {collection: des-looks-hivernaux-❄-homme, hint: [11_Looks_Complets, Superposition_Hiver]}

  asey_shop:
    enabled: true
    type: shopify
    name: "ASEY Shop"
    base: "https://www.aseyshop.com"
    min_delay: 65
    source_type: "boutique_locale"
    market: "maroc"
    license_class: reference_interne
    license_note: "Revendeur ; photos de la boutique ou de la marque. Droits non cédés."
