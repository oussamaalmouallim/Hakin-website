  nike_fr:
    enabled: true
    type: nike
    name: "Nike (site officiel, FR)"
    base: "https://www.nike.com"
    source_type: "site_marque"
    market: "international"
    license_class: autorisation_necessaire
    license_note: "Visuels officiels Nike, droits réservés. Référence interne uniquement."
    # Pages /w/ (listes) autorisées par robots.txt ; les pages produit /p/ sont exclues.
