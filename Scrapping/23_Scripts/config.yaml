    type: jumia
    name: "Jumia Maroc"
    base: "https://www.jumia.ma"
    source_type: "marketplace"
    market: "maroc"
    license_class: inconnue
    license_note: "Marketplace : photos fournies par des vendeurs tiers ou des marques ; titulaire des droits non identifié."
    # Pagination interdite par robots.txt sur /mlp-* : seule la page 1 y est lue.
    listings:
      - {path: /mlp-hoodies-homme/, hint: [02_Hoodies, null]}
      - {path: /mlp-sweat-homme-sans-capuche/, hint: [03_Sweats_Sans_Capuche, null]}
