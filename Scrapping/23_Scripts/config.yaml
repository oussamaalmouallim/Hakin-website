      - {path: /fr/w/hommes-lifestyle-chaussures-13jrmznik1zy7ok, hint: [08_Sneakers, Nike]}
      - {path: /fr/w/hommes-exterieur-nik1zxw4h}
      - {path: /fr/w/hommes-pantalons-et-leggings-2kq19znik1}

  openverse:
    enabled: false
    reason: "robots.txt de api.openverse.org : 'Disallow: /v1/images/' pour tous les agents (vérifié le 2026-10-10)."
    type: openverse
    name: "Openverse (CC / domaine public)"
    base: "https://api.openverse.org"
    source_type: "banque_images_licence_libre"
    market: "international"
    license_class: commercial_ok   # affiné image par image selon la licence (ND, NC exclues)
    queries:
