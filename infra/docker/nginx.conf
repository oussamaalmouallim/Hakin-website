# H MODE — nginx de l'image Docker. Mêmes règles que netlify.toml + web/public/_redirects :
# route connue → index.html en 200 ; adresse inconnue → index.html avec un vrai statut 404 (page 404 du site).
# index.html est servi directement dans chaque location (pas de redirection interne) pour garder ses en-têtes.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Santé du conteneur (HEALTHCHECK, sondes de l'hébergeur).
  location = /sante { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Fichiers du build : noms avec empreinte → cache d'un an. Photos : 30 jours.
  location /assets/ {
    include /etc/nginx/conf.d/securite.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /images/ {
    include /etc/nginx/conf.d/securite.inc;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  # Administration : jamais indexée.
  location ^~ /admin {
    include /etc/nginx/conf.d/securite.inc;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # Routes de l'application (même liste que web/public/_redirects) : 200.
  location ~ ^/(boutique|collections|recherche|produit|panier|commande|compte|connexion|contact|maison|livraison-retours|faq|guide-des-tailles|mentions-legales|confidentialite|cgv|design-system)(/.*)?$ {
    include /etc/nginx/conf.d/securite.inc;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # Accueil et fichiers de la racine (robots.txt, sitemap.xml, favicon…) ; le reste → 404 avec la page du site.
  location / {
    include /etc/nginx/conf.d/securite.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /index.html;
  location = /index.html {
    include /etc/nginx/conf.d/securite.inc;
    add_header Cache-Control "no-cache" always;
  }
}
